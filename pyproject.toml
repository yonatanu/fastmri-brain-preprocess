[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmri-preprocess"
version = "0.1.0"
description = "Preprocess 3 T fastMRI brain data and map fastMRI+ annotations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy", "scipy", "pandas", "pyarrow", "h5py", "torch", "sigpy",
    "einops", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "black", "isort", "flake8"]
cuda = ["cupy-cuda12x"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastmri_preprocess"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
